name: Task Service CI/CD

on:
  push:
    branches:
      - main
    # CRITICAL: Only run when files in the Task Service directory change
    paths:
      - 'backend/task-service/**' 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 1. Define temporary MySQL service for testing
    services:
      mysql_test:
        image: mysql:8.0
        env:
          # Use simplified test credentials
          MYSQL_ROOT_PASSWORD: test_pass
          MYSQL_DATABASE: task_test_db
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping" --health-interval 5s --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js and dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Wait for MySQL to start
        # Use a more explicit wait that relies on the defined service
        run: |
          echo "Waiting for test database..."
          while ! nc -z 127.0.0.1 3306; do 
            sleep 1 
          done
        
      # 3. Run Automated Tests (CI Stage)
      - name: Run Jest Tests
        run: |
          cd backend/task-service
          npm install
          npm test 
        env:
          # Inject variables so tests know how to connect to the temporary MySQL service
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_pass
          DB_NAME: task_test_db
          
      # 4. Build and Push Docker Image (CD Preparation)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/task-service 
          push: true
          tags: vichetkao/task-service:latest
          tags: vichetkao/task-service:${{ github.sha }} # Use commit SHA for unique tag
version: '3.8'

services:
  
  # ----------------------------------------------------------
  # DATABASE SERVICES (Pulling specific credentials from root .env)
  # ----------------------------------------------------------
  auth-db:
    image: mysql:8.0
    container_name: auth_mysql_db
    restart: always
    env_file:
      - ./.env # CRITICAL: Load the root file
    environment:
      MYSQL_ROOT_PASSWORD: root_auth_pass
      MYSQL_DATABASE: auth_database
      MYSQL_USER: ${AUTH_CRED_USER}
      MYSQL_PASSWORD: ${AUTH_CRED_PASS}
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${AUTH_CRED_USER}", "-p${AUTH_CRED_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  board-db:
    image: mysql:8.0
    container_name: board_mysql_db
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: root_board_pass
      MYSQL_DATABASE: board_database
      MYSQL_USER: ${BOARD_CRED_USER}
      MYSQL_PASSWORD: ${BOARD_CRED_PASS}
    volumes:
      - board-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${BOARD_CRED_USER}", "-p${BOARD_CRED_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  task-db:
    image: mysql:8.0
    container_name: task_mysql_db
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: root_task_pass
      MYSQL_DATABASE: task_database
      MYSQL_USER: ${TASK_CRED_USER}
      MYSQL_PASSWORD: ${TASK_CRED_PASS}
    volumes:
      - task-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${TASK_CRED_USER}", "-p${TASK_CRED_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # APPLICATION SERVICES (Mapping Specific to Generic App Keys)
  # ----------------------------------------------------------
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: express-auth-service
    # restart: always
    ports:
      - "${PORT_AUTH_SERVICE_EXTERNAL}:3001"
    env_file:
      - ./.env # CRITICAL FIX
    environment:
      NODE_ENV: development
      PORT: 3001
      # FIX: MAP specific root vars to generic app keys (DB_USER/DB_PASS)
      DB_HOST: auth-db            
      DB_USER: ${AUTH_CRED_USER}
      DB_PASSWORD: ${AUTH_CRED_PASS}
      DB_NAME: auth_database
      DB_DIALECT: mysql
      
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy

  board-service:
    build:
      context: ./backend/board-service
      dockerfile: Dockerfile
    container_name: express-board-service
    # restart: always
    ports:
      - "${PORT_BOARD_SERVICE_EXTERNAL}:3002"
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      PORT: 3002
      
      # MAPPING
      DB_HOST: board-db
      DB_USER: ${BOARD_CRED_USER}
      DB_PASSWORD: ${BOARD_CRED_PASS}
      DB_NAME: board_database
      DB_DIALECT: mysql
      
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      board-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  task-service:
    build:
      context: ./backend/task-service
      dockerfile: Dockerfile
    container_name: express-task-service
    # restart: always
    ports:
      - "${PORT_TASK_SERVICE_PUBLIC}:3003" 
    env_file:
      - ./.env # CRITICAL FIX
    environment:
      NODE_ENV: development
      PORT: 3003
      # MAPPING
      DB_HOST: task-db
      DB_USER: ${TASK_CRED_USER}
      DB_PASSWORD: ${TASK_CRED_PASS}
      DB_NAME: task_database
      DB_DIALECT: mysql
      
      AUTH_SERVICE_URL: http://auth-service:8001
      BOARD_SERVICE_URL: http://board-service:8002
      
    depends_on:
      task-db:
        condition: service_healthy
      board-service:
        condition: service_started 
      auth-service:
        condition: service_started

  # ----------------------------------------------------------
  # FRONTEND SERVICE
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs-task-tracker
    restart: always
    env_file:
      - ./.env # CRITICAL FIX
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:${PORT_TASK_SERVICE_PUBLIC} 
    ports:
      - "${PORT_FRONTEND}:3000" 
    depends_on:
      - task-service 

volumes:
  auth-db-data:
  board-db-data:
  task-db-data: